<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - GestEquip</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: #dc2626; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="text-align: center; margin-top: 0;">Espace Bénévole</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nom@club.fr">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Se connecter</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

<!-- Scripts Firebase SDK v9 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  
  <!-- Fichier de config Firebase partagé -->
  <script src="js/firebase-config.js"></script>

  <script>
    const loginForm = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        // Redirection vers l'application principale une fois connecté
        window.location.href = "index.html";
      } catch (err) {
        console.error("Erreur de connexion :", err);
        errorEl.textContent = "Identifiants incorrects ou accès refusé.";
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
